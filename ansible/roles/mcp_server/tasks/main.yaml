- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: yes
    create_home: yes
    home: "/home/{{ app_user }}"
    shell: /usr/sbin/nologin

- name: Create MCP Server directory
  file:
    path: "{{ server_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Upload MCP Server files
  copy:
    src: "{{ lookup('env', 'WORKSPACE') }}/birdwatching_mcp_server/"
    dest: "{{ server_dir }}"
    mode: 0755

- name: Create venv for server
  command: "python3 -m venv {{ server_dir }}/venv"
  args:
    creates: "{{ server_dir }}/venv"

- name: Install server dependencies
  pip:
    requirements: "{{ server_dir }}/requirements.txt"
    virtualenv: "{{ server_dir }}/venv"

- name: Generate .env for server
  template:
    src: server.env.j2
    dest: "{{ server_dir }}/.env"
